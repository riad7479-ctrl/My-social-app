
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f0f2f5;
}

header {
  background: #1877f2;
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input {
  width: 95%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
}

button {
  background: #1877f2;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  width: 100%;
  font-size: 16px;
  margin-top: 8px;
}
</style>
</head>

<body>

<header>Social App 🌍</header>

<div class="container">

<div class="card">
<h2>مرحبا بك 👋</h2>
<p>انضم إلى مجتمعنا وشارك لحظاتك مع الآخرين.</p>
<input type="text" placeholder="اسم المستخدم">
<input type="password" placeholder="كلمة المرور">
<button>تسجيل الدخول</button>
<button>إنشاء حساب جديد</button>
</div>

<div class="card">
<h3>شنو الجديد؟</h3>
<input type="text" id="postInput" placeholder="كتب شي منشور...">
<button id="publishBtn">نشر</button>
  <div id="posts"></div>
</div>

</div>
<script>

const input = document.getElementById("postInput");
const button = document.getElementById("publishBtn");
const posts = document.getElementById("posts");

button.addEventListener("click", function() {

    const message = input.value.trim();

    if (message === "") {
        alert("كتب شي منشور أولا!");
        return;
    }

    const post = document.createElement("p");

    post.textContent = message;

    posts.appendChild(post);

    input.value = "";

});

</script>
</body>
</html>
